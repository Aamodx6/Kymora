[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "kymora"
# Version is single-sourced from Cargo.toml; maturin injects the crate
# version into the wheel metadata at build time. Do not add `version` here.
dynamic = ["version"]
description = "Fast time-series feature extraction, Rust core"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aamod Kumar" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["time-series", "feature-extraction", "rust", "tsfresh", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Core install stays numpy-only. pandas is needed only for extract_features_df().
pandas = ["pandas>=1.5"]
polars = ["polars>=1.0"]
sklearn = ["scikit-learn>=1.3"]
all = ["pandas>=1.5", "polars>=1.0", "scikit-learn>=1.3"]
test = ["pytest>=7.0", "scipy>=1.10", "hypothesis>=6.100", "pandas>=1.5"]
bench = ["pandas>=1.5", "tsfresh>=0.20", "pycatch22>=0.4.5", "tsfel>=0.1.6"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
# Reference libraries for tests/parity (dev-only; parity tests skip without them).
dev-parity = ["tsfresh>=0.20", "tsfel>=0.1.6", "pycatch22>=0.4.5"]

[project.urls]
Homepage = "https://github.com/Aamodx6/Kymora"
Repository = "https://github.com/Aamodx6/Kymora"
Issues = "https://github.com/Aamodx6/Kymora/issues"
Changelog = "https://github.com/Aamodx6/Kymora/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "kymora._core"
python-packages = ["kymora"]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
# Collection-time deprecation from sklearn's generator-based
# parametrize_with_checks (third-party; the checks themselves all pass).
filterwarnings = ["ignore::pytest.PytestRemovedIn10Warning"]
