name: Release

# Wheels are built on every push to main (so a broken build surfaces before a
# tag), and published to PyPI only when a GitHub Release is published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: wheel ${{ matrix.target }} (manylinux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2014"
          # aarch64 needs emulation/cross; x86_64 builds natively.
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    name: wheel ${{ matrix.target }} (macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: wheel x64 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  smoke-test:
    name: install wheel and test (${{ matrix.os }}, py${{ matrix.python }})
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13", artifact: wheels-linux-x86_64}
          - {os: macos-latest, python: "3.13", artifact: wheels-macos-aarch64}
          - {os: windows-latest, python: "3.13", artifact: wheels-windows-x64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      # Installs from the built wheel only — no Rust toolchain on this runner,
      # so a missing/incompatible wheel fails here instead of at a user's pip.
      # Then runs the test suite against the installed wheel (not a dev build).
      - name: Install from wheel
        shell: bash
        run: |
          # Dependencies come from PyPI; kymora itself must come from the
          # freshly built wheel, so install it with --no-index --no-deps.
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24"
          python -m pip install --no-index --no-deps --find-links dist kymora
          python -m pip install "pytest>=7.0" "scipy>=1.10" "hypothesis>=6.100" "pandas>=1.5"
      - name: Smoke import outside the source tree
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python -c "
          import numpy as np, kymora
          X = np.random.default_rng(0).standard_normal((64, 128))
          f = kymora.extract_features(X)
          assert f.shape == (64, len(kymora.feature_names())), f.shape
          assert np.isfinite(f).all()
          print('ok', kymora.__version__, f.shape)
          "
      - name: Full test suite against the wheel
        shell: bash
        run: |
          python -m pytest "${GITHUB_WORKSPACE}/tests/" -q

  sbom:
    name: SBOM (SPDX) for release artifacts
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    permissions:
      # Uploading the SBOM to the release needs write; the file itself is
      # attached exactly once by the github-release job below.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: kymora-sbom.spdx.json
          upload-release-assets: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: kymora-sbom.spdx.json

  publish:
    name: publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [linux, macos, windows, sdist, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing (OIDC) — no PyPI API token is stored in this repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: attach artifacts to the GitHub Release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [linux, macos, windows, sdist, smoke-test, sbom, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: dist
      - name: Attach wheels, sdist, and SBOM to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
