[package]
name = "kymora"
version = "0.8.0"
edition = "2021"

[lib]
name = "_core"
# cdylib: the Python extension (what maturin ships). rlib: lets the
# cargo-fuzz harness and other Rust targets link the core (Phase 6.3).
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
numpy = "0.26"
rayon = "1"
realfft = "3.5.0"
bitflags = "2"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
