[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "tsxtractor"
version = "0.1.1"
description = "Fast time-series feature extraction, Rust core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["time-series", "feature-extraction", "rust", "tsfresh", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/Aamod007/Tsxtract"
Repository = "https://github.com/Aamod007/Tsxtract"
Issues = "https://github.com/Aamod007/Tsxtract/issues"

[tool.maturin]
python-source = "python"
module-name = "tsxtractor._core"
features = ["pyo3/extension-module"]
