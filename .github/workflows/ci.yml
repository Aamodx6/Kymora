name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # The pyo3 extension-module feature omits libpython at link time, which
      # breaks `cargo test` binaries; test the pure-Rust core without it.
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features

  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 3.9 omitted deliberately (EOL Oct 2025; abi3-py310 floor is 3.10).
      # macos x86_64 has no GitHub-hosted runner anymore (see wheel-smoke);
      # macos-latest is arm64. Linux aarch64 covers the other ARM target.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.python }}
      - uses: ./.github/actions/setup-venv
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install -e ".[test]"
      - name: Build extension in release mode
        run: maturin develop --release
      - name: Run tests
        run: python -m pytest tests/ -q

  validation-report:
    name: reference-validation report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[test]"
          maturin develop --release
      - run: python tools/validation_report.py --out validation-report.md
      - name: Publish report to the job summary
        run: cat validation-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.md

  typecheck:
    name: mypy against the type stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin mypy pandas-stubs
          python -m pip install -e ".[all]"
          maturin develop --release
      - run: mypy python/kymora

  snippets:
    name: README + docs snippets execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin scikit-learn
          python -m pip install -e ".[test]"
          maturin develop --release
      - run: python tools/check_snippets.py

  audit:
    name: dependency audit (Rust + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-audit (RustSec advisory DB)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-venv
      - name: pip-audit (PyPI advisory DB)
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[all]"
          python -m pip_audit --desc

  perf-gate:
    name: core33 perf regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e "."
          maturin develop --release
      # --ci never records: first run on a runner class passes with a
      # notice; maintainers record baselines via
      # `python tools/perf_gate.py --runs 30 --update-baseline`.
      - run: python tools/perf_gate.py --runs 30 --ci

  feature-docs:
    name: generated feature catalog is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e "."
          maturin develop --release
      - run: python tools/gen_feature_docs.py --check

  fuzz-smoke:
    name: fuzz smoke (nightly, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: |
          cd fuzz
          for target in compute_all streaming ragged; do
            cargo fuzz run "$target" -- -max_total_time=30 -print_final_stats=1
          done

  wheel-smoke:
    # Tests the built wheels (not dev builds): abi3 wheels are the shipping
    # config, so this is what users install. Covers linux x64 + windows x64
    # here; the release workflow builds the full platform matrix.
    # NOTE: `shell: bash` everywhere below — the default pwsh on Windows
    # neither glob-expands the wheel path nor fails fast, which once shipped
    # a green step with no kymora installed at all.
    name: wheel install + tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-venv
      - name: Build release wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release
      - name: Install wheel + test deps (no editable install)
        shell: bash
        run: |
          python -m pip install "target/wheels/kymora-"*.whl
          python -m pip install "pytest>=7.0" "scipy>=1.10" "hypothesis>=6.100" "pandas>=1.5"
      - name: Run tests against the installed wheel
        shell: bash
        run: python -m pytest tests/ -q
