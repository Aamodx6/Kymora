name: Wheels (reusable)

# Single home for wheel builds + install tests. Called by ci.yml (code PRs)
# and release.yml (tags). Nothing else in the repo builds wheels.
#
# Matrix scale is an input: PRs run lite (5 builds + 3 OSes x py3.13);
# main pushes and tags run full (lite + py3.10/3.14 extremes on linux/win).
on:
  workflow_call:
    inputs:
      full:
        description: "Run the extended wheel-test matrix (py3.10/3.14 extremes)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: "Run the extended wheel-test matrix"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-linux:
    name: wheel build (manylinux, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2014"
          # aarch64 needs emulation/cross; x86_64 builds natively.
          sccache: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-macos:
    name: wheel build (macOS, ${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-windows:
    name: wheel build (Windows, x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          architecture: x64
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x64
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-windows-x64
          path: dist

  build-sdist:
    name: sdist (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-sdist
          path: dist

  sdist-test:
    name: sdist verify and install (ubuntu-latest, py3.12)
    needs: [build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheels-sdist
          path: dist
      - name: Verify sdist archive contents
        shell: bash
        run: |
          tar -ztvf dist/kymora-*.tar.gz > sdist_contents.txt
          cat sdist_contents.txt
          for req in Cargo.toml Cargo.lock pyproject.toml LICENSE README.md src/lib.rs; do
            if ! grep -q "$req" sdist_contents.txt; then
              echo "FAIL: Required file $req missing in sdist"
              exit 1
            fi
          done
          echo "All required files present in sdist."
      - name: Install from sdist
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "scipy>=1.10" "scikit-learn>=1.2" "pandas>=1.5"
          python -m pip install "polars>=0.20" || true
          python -m pip install dist/kymora-*.tar.gz
      - name: Verify clean install from sdist
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python "${GITHUB_WORKSPACE}/tools/verify_clean_install.py"

  wheel-test:
    # Lite matrix (always): one supported Python per desktop OS, from the
    # matching built artifact. Installs from the wheel only — no Rust
    # toolchain on this runner, so a missing/incompatible wheel fails here
    # instead of at a user's pip. Then smoke import + full test suite.
    # NOTE: `shell: bash` everywhere below — the default pwsh on Windows
    # neither glob-expands the wheel path nor fails fast, which once shipped
    # a green step with no kymora installed at all.
    name: wheel-test (${{ matrix.os }}, py${{ matrix.python }})
    needs: [build-linux, build-macos, build-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13", artifact: wheels-linux-x86_64}
          - {os: macos-latest, python: "3.13", artifact: wheels-macos-aarch64}
          - {os: windows-latest, python: "3.13", artifact: wheels-windows-x64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install from wheel
        shell: bash
        run: |
          # Dependencies come from PyPI; kymora itself must come from the
          # freshly built wheel, so install it with --no-index --no-deps.
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "scipy>=1.10" "scikit-learn>=1.2" "pandas>=1.5" "pytest>=7.0" "hypothesis>=6.100"
          python -m pip install "polars>=0.20" || echo "polars not available on this platform"
          python -m pip install --no-index --no-deps --find-links dist kymora
      - name: Verify clean install (6 checks) outside source tree
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python "${GITHUB_WORKSPACE}/tools/verify_clean_install.py"
      - name: Full test suite against the wheel
        shell: bash
        run: |
          python -m pytest "${GITHUB_WORKSPACE}/tests/" -q

  wheel-test-extended:
    # Full matrix extra (main/tags only): oldest/newest Python extremes on
    # linux + windows. Same wheel-only install-test as `wheel-test`.
    name: wheel-test-extended (${{ matrix.os }}, py${{ matrix.python }})
    if: ${{ inputs.full }}
    needs: [build-linux, build-macos, build-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10", artifact: wheels-linux-x86_64}
          - {os: ubuntu-latest, python: "3.14", artifact: wheels-linux-x86_64}
          - {os: windows-latest, python: "3.10", artifact: wheels-windows-x64}
          - {os: windows-latest, python: "3.14", artifact: wheels-windows-x64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install from wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "scipy>=1.10" "scikit-learn>=1.2" "pandas>=1.5" "pytest>=7.0" "hypothesis>=6.100"
          python -m pip install "polars>=0.20" || echo "polars not available on this platform"
          python -m pip install --no-index --no-deps --find-links dist kymora
      - name: Verify clean install (6 checks) outside source tree
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python "${GITHUB_WORKSPACE}/tools/verify_clean_install.py"
      - name: Full test suite against the wheel
        shell: bash
        run: |
          python -m pytest "${GITHUB_WORKSPACE}/tests/" -q
