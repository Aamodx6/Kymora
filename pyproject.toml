[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "tsxtract"
version = "0.1.0"
description = "Fast time-series feature extraction, Rust core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.maturin]
python-source = "python"
module-name = "tsxtract._core"
features = ["pyo3/extension-module"]
