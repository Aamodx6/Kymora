name: benchmarks

# Runs the benchmark suite on CI runners so headline numbers are not
# single-machine artifacts. Results are uploaded as artifacts; they are NOT
# copied into README/CLAIMS.md until a maintainer reviews them (machine-class
# differences make CI numbers non-comparable to laptop numbers).
# See CLAIMS.md "PENDING" rows and OWNER_DECISIONS.md item 5.

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Sundays 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Build wheel (release)
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy
          maturin build --release --out dist
          pip install --force-reinstall --no-deps dist/kymora-*.whl

      - name: Install benchmark dependencies
        run: |
          pip install pytest psutil scipy pandas tsfresh pycatch22 tsfel joblib

      - name: Sanity build info
        run: |
          python -c "import kymora; print('kymora', kymora.__version__); print(len(kymora.feature_names()), 'features')"

      - name: Equal-feature parity gate
        run: |
          python benchmarks/suites/equal_feature.py parity

      - name: Equal-feature benchmark (reduced)
        run: |
          python benchmarks/suites/equal_feature.py bench --rounds 2 --shape 1000 500

      - name: Profile + scaling re-measure
        run: |
          python benchmarks/suites/remeasure_readme.py --skip-slow

      - name: Record runner environment
        shell: bash
        run: |
          {
            echo "## Runner: ${{ matrix.os }}"
            echo '```'
            python -c "import platform, os; print(platform.platform()); print('CPUs:', os.cpu_count())"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.os }}-${{ github.run_id }}
          path: |
            benchmarks/results/*_equal_feature/
            benchmarks/results/*_remeasure/
          retention-days: 90
          if-no-files-found: warn
