name: Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"
      - "deny.toml"
      - "fuzz/**"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target"
        default: "75"

permissions:
  contents: read

jobs:
  deps-prerelease:
    name: latest + pre deps (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - name: Install latest and pre-release dependencies
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install --upgrade --pre numpy scipy scikit-learn pandas polars pytest hypothesis
          maturin develop --release
      - name: Run test suite against pre-releases
        run: python -m pytest tests/ -q

  deps-lowest-direct:
    name: lowest-direct deps (ubuntu-latest, py3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install minimum direct declared dependencies via uv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip maturin
          uv pip install --resolution lowest-direct -e ".[test]"
          maturin develop --release
          python -m pytest tests/ -q

  hypothesis-deep:
    name: hypothesis deep exploration (ubuntu-latest, 2000 examples)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - name: Install dependencies and build extension
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[test]"
          maturin develop --release
      - name: Run Hypothesis property tests with 2000 examples
        run: python -m pytest tests/property tests/test_invariants.py -q -o hypothesis_settings.max_examples=2000

  cargo-fuzz:
    name: cargo-fuzz (ubuntu-latest, 5min total)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzzing targets (streaming push/compute, compute_all, ragged, edge_cases)
        run: |
          cd fuzz
          # Default 4 targets x 75s = 300s (5 minutes) total fuzzing time
          for target in compute_all streaming ragged edge_cases; do
            echo "--- Fuzzing $target (${{ github.event.inputs.fuzz_seconds || '75' }}s) ---"
            cargo fuzz run "$target" -- -max_total_time=${{ github.event.inputs.fuzz_seconds || '75' }} -print_final_stats=1
          done

  security-audit:
    name: security audit (cargo-audit, cargo-deny, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo-audit (RustSec advisory DB)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: cargo-deny (bans, licenses, sources, advisories)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: ./.github/actions/setup-venv
      - name: pip-audit (PyPI advisory DB)
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[all]"
          python -m pip_audit --desc

  lychee-links:
    name: lychee link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lychee Link Checker
        uses: lycheeverse/lychee-action@649b0e4890508ea3e11ea6b3ee35ce899a25afd5 # v2.9.0
        with:
          args: --verbose --no-progress --exclude-mail --exclude-loopback --accept 200..=204,403,429 './**/*.md' './**/*.html'
        continue-on-error: true

  wallclock-trend:
    name: wall-clock benchmark trend (alert only, non-failing)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[bench,test]"
          maturin develop --release
      - name: Run perf probe
        run: python tools/perf_gate.py --ci --export-benchmark-json "${{ runner.temp }}/benchmark_results.json"
      - name: Clean working tree
        run: |
          git checkout -- .
          git clean -fd
      - name: Store and track benchmark trend
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Kymora Core33 1kx500 Benchmark (Nightly Trend)
          tool: 'customSmallerIsBetter'
          output-file-path: ${{ runner.temp }}/benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '120%'
          comment-on-alert: false
          fail-on-alert: false
          gh-pages-branch: 'gh-pages'
          benchmark-data-dir-path: 'dev/bench'
          summary-always: true

  report-nightly-failure:
    name: file or update nightly-failure issue
    needs: [deps-prerelease, deps-lowest-direct, hypothesis-deep, cargo-fuzz, security-audit, lychee-links]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Open or update nightly-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Nightly CI failure on ${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Nightly workflow failed on ref \`${{ github.ref_name }}\`.\n\n**Run Details:** $RUN_URL\n\nInspect the failed jobs in the run logs to resolve the issue."
          gh label create nightly-failure --color D93F0B --description "Automated nightly workflow failure" 2>/dev/null || true
          NUM=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            echo "Creating new issue with label nightly-failure..."
            gh issue create --title "$TITLE" --label nightly-failure --body "$BODY"
          else
            echo "Updating existing issue #$NUM..."
            gh issue comment "$NUM" --body "$BODY"
          fi
