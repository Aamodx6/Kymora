[package]
name = "tsxtractor"
version = "0.5.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
numpy = "0.26"
rayon = "1"
realfft = "3.5.0"
bitflags = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
