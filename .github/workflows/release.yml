name: Release

# Tag-only publisher. Wheels are verified on every code PR via the ci.yml
# call to wheels.yml, so this workflow builds them once more from the tag
# and publishes. Manual dispatch builds without publishing (dry run).
# No concurrency group: a release must never cancel another run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and verify release assets without publishing"
        type: boolean
        default: true
      test_pypi:
        description: "Publish to TestPyPI instead of production PyPI (staging)"
        type: boolean
        default: false

# One tag must never start two concurrent publishes: queue, never cancel
# (cancel-in-progress: false). A duplicate run fails safe at PyPI with
# `400 File already exists` (observed on v0.8.0), but serialization avoids
# the noise and any upload race entirely.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-check:
    # Tag vX.Y.Z must equal Cargo.toml [package] version; pyproject must keep
    # its version dynamic (maturin injects it from Cargo.toml at build time).
    # Branch dispatches are dry runs: the check passes trivially without a tag.
    name: version check (tag matches Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag vX.Y.Z must equal Cargo.toml version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          ref, name = os.environ["REF"], os.environ["REF_NAME"]
          if not ref.startswith("refs/tags/v"):
              print(f"dry run on {ref}; version check passes trivially")
              sys.exit(0)
          tag = name[1:]
          if not re.fullmatch(r"\d+\.\d+\.\d+", tag):
              print(f"tag {name} is not vX.Y.Z")
              sys.exit(1)
          cargo = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          static = project.get("version")
          dynamic = project.get("dynamic", [])
          print(f"tag={tag} cargo={cargo} pyproject-dynamic={dynamic} static={static}")
          if static is not None:
              print("pyproject must keep a dynamic version (maturin injects it from Cargo.toml)")
              sys.exit(1)
          if "version" not in dynamic:
              print("pyproject must declare dynamic = ['version']")
              sys.exit(1)
          if cargo != tag:
              print(f"MISMATCH: tag v{tag} != Cargo.toml {cargo}")
              sys.exit(1)
          print("version check OK")
          EOF

  wheels:
    name: "wheels (reusable: build + install-test)"
    needs: [version-check]
    uses: ./.github/workflows/wheels.yml
    with:
      full: true

  sbom:
    name: SBOM SPDX (ubuntu-latest)
    needs: [version-check, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Uploading the SBOM to the release needs write; the file itself is
      # attached exactly once by the github-release job below.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: kymora-sbom.spdx.json
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: kymora-sbom.spdx.json

  pypi-publish:
    name: PyPI publish (production)
    # Tag-only AND not test_pypi / not dry run: publishing to production PyPI.
    # OIDC Trusted Publishing, environment protection rules require manual maintainer approval.
    if: startsWith(github.ref, 'refs/tags/v') && (inputs.test_pypi != true) && (inputs.dry_run != true)
    needs: [version-check, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  testpypi-publish:
    name: TestPyPI publish (staging)
    # Runs when test_pypi input is true AND dry_run is false on workflow_dispatch or testing tags.
    if: (inputs.test_pypi == true) && (inputs.dry_run != true)
    needs: [version-check, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub release attach (ubuntu-latest)
    # Tag-only: attach release assets and build attestations when a tag is published.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, wheels, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom
          path: dist
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Attach wheels, sdist, SBOM, and checksums to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
