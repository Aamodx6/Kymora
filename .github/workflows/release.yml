name: Release

# Tag-only publisher. Wheels are verified on every code PR via the ci.yml
# call to wheels.yml, so this workflow builds them once more from the tag
# and publishes. Manual dispatch builds without publishing (dry run).
# No concurrency group: a release must never cancel another run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One tag must never start two concurrent publishes: queue, never cancel
# (cancel-in-progress: false). A duplicate run fails safe at PyPI with
# `400 File already exists` (observed on v0.8.0), but serialization avoids
# the noise and any upload race entirely.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-check:
    # Tag vX.Y.Z must equal Cargo.toml [package] version; pyproject must keep
    # its version dynamic (maturin injects it from Cargo.toml at build time).
    # Branch dispatches are dry runs: the check passes trivially without a tag.
    name: version check (tag matches Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag vX.Y.Z must equal Cargo.toml version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          ref, name = os.environ["REF"], os.environ["REF_NAME"]
          if not ref.startswith("refs/tags/v"):
              print(f"dry run on {ref}; version check passes trivially")
              sys.exit(0)
          tag = name[1:]
          if not re.fullmatch(r"\d+\.\d+\.\d+", tag):
              print(f"tag {name} is not vX.Y.Z")
              sys.exit(1)
          cargo = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          static = project.get("version")
          dynamic = project.get("dynamic", [])
          print(f"tag={tag} cargo={cargo} pyproject-dynamic={dynamic} static={static}")
          if static is not None:
              print("pyproject must keep a dynamic version (maturin injects it from Cargo.toml)")
              sys.exit(1)
          if "version" not in dynamic:
              print("pyproject must declare dynamic = ['version']")
              sys.exit(1)
          if cargo != tag:
              print(f"MISMATCH: tag v{tag} != Cargo.toml {cargo}")
              sys.exit(1)
          print("version check OK")
          EOF

  wheels:
    name: "wheels (reusable: build + install-test)"
    needs: [version-check]
    uses: ./.github/workflows/wheels.yml
    with:
      full: true

  sbom:
    name: SBOM SPDX (ubuntu-latest)
    needs: [version-check, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Uploading the SBOM to the release needs write; the file itself is
      # attached exactly once by the github-release job below.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: kymora-sbom.spdx.json
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: kymora-sbom.spdx.json

  pypi-publish:
    name: PyPI publish (ubuntu-latest)
    # Tag-only: unreachable on workflow_dispatch from a branch (dry run builds
    # wheels + SBOM but publishes nothing). OIDC semantics unchanged from the
    # old `publish` job: Trusted Publishing, no stored API token.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Trusted Publishing (OIDC) — no PyPI API token is stored in this repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: GitHub release attach (ubuntu-latest)
    # Tag-only, same gate as pypi-publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, wheels, sbom, pypi-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: dist
      - name: Attach wheels, sdist, and SBOM to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
