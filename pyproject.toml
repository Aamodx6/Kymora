[build-system]
requires = ["maturin>=1.16.0,<2.0"]
build-backend = "maturin"

[project]
name = "kymora"
# Version is single-sourced from Cargo.toml; maturin injects the crate
# version into the wheel metadata at build time. Do not add `version` here.
dynamic = ["version"]
description = "High-performance Time Series Feature Extraction Library in Rust and Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aamod Kumar" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6"]
keywords = [
    "time-series-feature-extraction-library",
    "time-series-feature-extraction",
    "time-series",
    "time-series-analysis",
    "feature-extraction",
    "feature-engineering",
    "signal-processing",
    "tsfel",
    "tsfresh",
    "catch22",
    "tsfast",
    "tsfresh-alternative",
    "tsfel-alternative",
    "machine-learning",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Core install stays numpy-only. pandas is needed only for extract_features_df().
pandas = ["pandas>=2.3.3"]
polars = ["polars>=2.0.0"]
sklearn = ["scikit-learn>=1.7.2"]
all = ["pandas>=2.3.3", "polars>=2.0.0", "scikit-learn>=1.7.2"]
test = ["pytest>=9.2.0", "scipy>=1.15.3", "hypothesis>=6.168.5", "pandas>=2.3.3"]
bench = ["pandas>=2.3.3", "tsfresh>=0.21.2", "pycatch22>=1.0.2", "tsfel>=0.2.0"]
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.7.7"]
# Reference libraries for tests/parity (dev-only; parity tests skip without them).
dev-parity = ["tsfresh>=0.21.2", "tsfel>=0.2.0", "pycatch22>=1.0.2"]

[project.urls]
Homepage = "https://landing-drab-six-14.vercel.app"
Documentation = "https://aamodx6.github.io/Kymora/"
Repository = "https://github.com/Aamodx6/Kymora"
Issues = "https://github.com/Aamodx6/Kymora/issues"
Changelog = "https://github.com/Aamodx6/Kymora/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "kymora._core"
python-packages = ["kymora"]
features = ["pyo3/extension-module"]
# Keep the sdist to what a downstream builder needs: no landing site,
# benchmark evidence, papers, patent material, fuzz corpora, workflows,
# or docs build output (verified via `maturin sdist` + `tar -tzf`).
exclude = [
  ".github/**",
  ".gitignore",
  "benchmarks/results/**",
  "landing/**",
  "paper/**",
  "patent/**",
  "fuzz/**",
  "site/**",
]

[tool.pytest.ini_options]
# Collection-time deprecation from sklearn's generator-based
# parametrize_with_checks (third-party; the checks themselves all pass).
filterwarnings = ["ignore::pytest.PytestDeprecationWarning"]
