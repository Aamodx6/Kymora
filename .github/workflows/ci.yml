name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Path filtering is job-level (see the `changes` job): docs/landing-only
# changes run only the docs + hygiene jobs, code changes run everything.
# Workflow-level `paths-ignore` is deliberately NOT used: a workflow that
# never triggers leaves required checks "expected" forever and blocks merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes (paths-filter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'src/**'
              - 'python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - '.github/**'
              - 'tests/**'
              - 'tools/**'
              - 'fuzz/**'
              - 'benchmarks/**'
            docs:
              - 'docs/**'
              - 'landing/**'
              - 'paper/**'
              - 'README.md'
              - 'CLAIMS.md'
              - 'mkdocs.yml'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - 'deny.toml'

  rust:
    name: rust fmt, clippy, tests (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}-rust
      - name: Format check (ubuntu-latest only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      # The pyo3 extension-module feature omits libpython at link time, which
      # breaks `cargo test` binaries on macOS unless dynamic_lookup is passed;
      # test the pure-Rust core without it.
      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings
        env:
          RUSTFLAGS: ${{ runner.os == 'macOS' && '-C link-arg=-undefined -C link-arg=dynamic_lookup' || '' }}
      - name: Rust tests
        run: cargo test --no-default-features
        env:
          RUSTFLAGS: ${{ runner.os == 'macOS' && '-C link-arg=-undefined -C link-arg=dynamic_lookup' || '' }}

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 3.9 omitted deliberately (EOL Oct 2025; abi3-py310 floor is 3.10).
      # macos-latest is arm64. Linux aarch64 covers the other ARM target;
      # macOS Intel is covered by the dedicated test-macos-intel job.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.python }}
      - uses: ./.github/actions/setup-venv
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install -e ".[test]"
      - name: Build extension in release mode
        run: maturin develop --release
      - name: Run tests
        run: python -m pytest tests/ -q

  test-macos-intel:
    # macos-13 (Intel) is retired; macos-15-intel is the supported Intel
    # label until Aug 2027 (see CONTRIBUTING.md §CI runner notes).
    name: test (py3.12, macos-15-intel)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-15-intel-3.12
      - uses: ./.github/actions/setup-venv
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install -e ".[test]"
      - name: Build extension in release mode
        run: maturin develop --release
      - name: Run tests
        run: python -m pytest tests/ -q

  parity:
    # External parity (tsfresh/TSFEL matched sets) with teeth: installs the
    # dev-parity extras and sets KYMORA_REQUIRE_PARITY=1, so a missing
    # reference library fails via tests/parity/conftest.py instead of
    # skipping silently. Path-gated like the other test jobs.
    name: parity external (ubuntu-latest, py3.12)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KYMORA_REQUIRE_PARITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[dev-parity,test]"
          maturin develop --release
      - run: python -m pytest tests/parity -q -rs

  validation-report:
    name: validation report (ubuntu-latest, py3.12)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[bench,test]"
          maturin develop --release
      - run: python tools/validation_report.py --out validation-report.md
      - name: Publish report to the job summary
        run: cat validation-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-report
          path: validation-report.md
      - name: Verify reproduce.sh one-command reproduction
        run: |
          python -m pip install numba tabulate
          bash reproduce.sh 1 > reproduce_output.txt
          cat reproduce_output.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reproduce-output
          path: reproduce_output.txt

  typecheck:
    name: mypy (ubuntu-latest, py3.12)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin mypy pandas-stubs
          python -m pip install -e ".[all]"
          maturin develop --release
      - run: mypy python/kymora

  docs:
    # Folds old ci jobs `snippets` + `feature-docs` plus the docs.yml
    # `mkdocs build --strict` check: one job, same coverage.
    name: docs (ubuntu-latest, py3.12)
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin mkdocs mkdocs-material scikit-learn
          python -m pip install -e ".[test]"
          maturin develop --release
      - run: mkdocs build --strict
      - run: python tools/check_versions.py
      - run: python tools/check_claims.py
      - run: python paper/gen_numbers.py
      - run: python tools/verify_live_site.py
      - run: python tools/gen_feature_docs.py --check
      - run: python tools/check_snippets.py

  hygiene:
    name: repo hygiene (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python tools/check_repo_hygiene.py
      - run: python tools/check_versions.py
      - run: python tools/check_claims.py
      - run: python paper/gen_numbers.py
      - run: python tools/verify_live_site.py

  audit-pr:
    # Dependency audits also run on PRs, but only when manifests change; the
    # full cargo-audit/deny + pip-audit suite always runs in nightly.yml too.
    name: dependency audit PR (ubuntu-latest)
    needs: [changes]
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo-audit (RustSec advisory DB)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: ./.github/actions/setup-venv
      - name: pip-audit (PyPI advisory DB)
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[all]"
          python -m pip_audit --desc

  wheels:
    # Wheel build + install tests live ONLY in wheels.yml. PRs get the lite
    # matrix (5 builds + 3 OSes x py3.13); pushes to main get the full one.
    name: "wheels (reusable: build + install-test)"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/wheels.yml
    with:
      full: ${{ github.event_name == 'push' }}

  benchmark:
    name: benchmark regression gate (ubuntu-latest, py3.12)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[bench,test]"
          maturin develop --release
      - name: Run perf gate probe
        run: python tools/perf_gate.py --ci --export-benchmark-json "${{ runner.temp }}/benchmark_results.json"
      - name: Clean working tree before benchmark tracking
        run: |
          git checkout -- .
          git clean -fd
      - name: Store and track benchmark result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Kymora Core33 1kx500 Benchmark
          tool: 'customSmallerIsBetter'
          output-file-path: ${{ runner.temp }}/benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
          gh-pages-branch: 'gh-pages'
          benchmark-data-dir-path: 'dev/bench'
          summary-always: true

  bench-instructions:
    name: benchmark instruction gate (ubuntu-latest)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build HEAD instruction benchmark
        run: |
          cargo build --release --bench core33_instructions --no-default-features
          mkdir -p /tmp/bench-bins
          HEAD_BIN=$(find target/release/ -type f \( -name "core33_instructions" -o -name "core33_instructions-*" \) ! -name "*.*" | head -n 1)
          echo "Found HEAD binary at: $HEAD_BIN"
          cp "$HEAD_BIN" /tmp/bench-bins/head-bench
      - name: Build BASE instruction benchmark
        id: build-base
        continue-on-error: true
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          echo "Attempting to build base ref: $BASE_REF"
          git checkout "$BASE_REF" || git checkout origin/main
          if cargo build --release --bench core33_instructions --no-default-features; then
            BASE_BIN=$(find target/release/ -type f \( -name "core33_instructions" -o -name "core33_instructions-*" \) ! -name "*.*" | head -n 1)
            if [ -n "$BASE_BIN" ] && [ -f "$BASE_BIN" ]; then
              echo "Found BASE binary at: $BASE_BIN"
              cp "$BASE_BIN" /tmp/bench-bins/base-bench
              echo "base_built=true" >> "$GITHUB_OUTPUT"
            else
              echo "base_built=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Base ref does not support core33_instructions bench target"
            echo "base_built=false" >> "$GITHUB_OUTPUT"
          fi
          git checkout -
      - name: Run instruction-count comparison gate
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          BASE_ARG=""
          if [ -f /tmp/bench-bins/base-bench ]; then
            BASE_ARG="--base-bin /tmp/bench-bins/base-bench"
          fi
          python tools/check_perf_instructions.py --head-bin /tmp/bench-bins/head-bench $BASE_ARG

  test-freethreaded:
    name: test freethreaded (py3.13t, ubuntu-latest)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13t"
          cache: pip
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/setup-venv
      - name: Verify free-threaded execution without GIL or document limitation
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install "numpy>=2.1.0" pytest
          echo "Testing build on Python 3.13t..."
          if maturin develop --release; then
            python -c "
            import sys
            assert hasattr(sys, '_is_gil_enabled'), 'sys._is_gil_enabled missing on Python 3.13t'
            gil_before = sys._is_gil_enabled()
            print('GIL before import:', gil_before)
            assert not gil_before, f'Expected GIL disabled at startup, got {gil_before}'

            import kymora
            gil_after_import = sys._is_gil_enabled()
            print('GIL after import kymora:', gil_after_import)
            assert not gil_after_import, f'GIL was re-enabled after importing kymora: {gil_after_import}'

            import numpy as np
            X = np.random.randn(100, 500)
            res = kymora.extract_features(X, n_jobs=2)
            gil_after_extract = sys._is_gil_enabled()
            print('GIL after parallel extract:', gil_after_extract)
            assert not gil_after_extract, f'GIL was re-enabled after parallel extract: {gil_after_extract}'

            print(f'SUCCESS: kymora {kymora.__version__} operates with GIL disabled on Python 3.13t')
            "
            python -m pytest tests/test_python_api.py -q
          else
            echo "::notice ::CPython 3.13t build unsupported upstream by PyO3 (requires CPython >= 3.14). Marking job as documentation-only per specification."
            echo "### Python 3.13t Free-Threaded Status: Documentation-Only" >> $GITHUB_STEP_SUMMARY
            echo "PyO3 emits: *PyO3 does not support the free-threaded build of CPython versions below 3.14, the selected Python version is 3.13*." >> $GITHUB_STEP_SUMMARY
            echo "Kymora module defines \`#[pymodule(gil_used = false)]\` in src/lib.rs for thread safety under Python 3.14t+." >> $GITHUB_STEP_SUMMARY
            echo "Job marked documentation-only until PyO3 upstream supports Python 3.13t." >> $GITHUB_STEP_SUMMARY
          fi

  ci-gate:
    # The ONLY required status check (see CONTRIBUTING.md). Aggregates every
    # job (including the wheels reusable-workflow call): fails when changes
    # itself failed/was cancelled, or on any other failure/cancelled;
    # allows path-gated skips. Logic lives in tools/ci_gate.py (unit-tested
    # below and via --self-test).
    name: ci gate (all green)
    needs: [changes, rust, test, test-macos-intel, parity, validation-report, typecheck, docs, hygiene, audit-pr, wheels]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Self-test the gate logic
        run: python tools/ci_gate.py --self-test
      - name: Fail on any failure or cancellation
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: python tools/ci_gate.py
