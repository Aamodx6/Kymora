site_name: kymora
site_description: Batch time-series feature extraction for Python, with a Rust core.
site_url: https://aamodx6.github.io/Kymora/
repo_url: https://github.com/Aamodx6/Kymora
repo_name: Aamodx6/Kymora
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Getting started:
    - Home: index.md
    - Install: install.md
    - Quickstart: quickstart.md
    - Migrating: migrating.md
    - FAQ: faq.md
  - Reference:
    - API reference: api.md
    - Feature reference: features.md
    - NaN policy: nan-policy.md
    - Validation report: validation.md
    - Parity matrix: parity_matrix.md
  - Benchmarks:
    - Benchmarks: benchmarks.md
  - Project:
    - Contributing: contributing.md
    - Roadmap: ROADMAP.md
    - Changelog: https://github.com/Aamodx6/Kymora/blob/main/CHANGELOG.md
    - Architecture: https://github.com/Aamodx6/Kymora/blob/main/arch.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences
  - pymdownx.details

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Aamodx6/Kymora
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kymora/
